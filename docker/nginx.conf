# nginx as XCP Pulse's optional built-in TLS terminator.
#
# Only used when XCP_PULSE_ENABLE_HTTPS=true — see docker/entrypoint.sh, which
# is what starts nginx with this config. Runs entirely as the same non-root
# `pulse` user as uvicorn: nothing here needs root, since 8080/8443 are both
# unprivileged ports, so all of nginx's own state (logs, pid, temp
# directories) is redirected under /tmp/nginx rather than the root-owned
# defaults (/var/log/nginx, /var/lib/nginx) a stock install expects.
#
# The certificate is read from /data/tls/cert.pem and key.pem — either the
# self-signed pair docker/entrypoint.sh generates on first run, or one
# uploaded through Settings (see app/routes/settings.py and app/tls.py).
# nginx is restarted (not reloaded) after an upload so a replaced cert takes
# effect immediately; see app/tls.py's restart signal.

pid /tmp/nginx/run/nginx.pid;
error_log /tmp/nginx/logs/error.log warn;
worker_processes 1;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;
  access_log /tmp/nginx/logs/access.log;

  # A collected log bundle runs to several hundred MB, uploaded through the
  # app rather than through nginx — but redaction previews and cert uploads
  # still pass through here, so the default 1m body limit is raised generously
  # rather than tuned per-route.
  client_max_body_size 64m;

  # The download of a multi-hundred-MB bundle from the browser is a plain
  # response body streamed straight through, not something nginx needs to
  # buffer to disk first.
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Plain HTTP redirects to HTTPS, so an old bookmark or a typed http:// URL
  # still lands — it never serves the app itself.
  server {
    listen 8080;
    server_name _;
    return 302 https://$host:8443$request_uri;
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /data/tls/cert.pem;
    ssl_certificate_key /data/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
