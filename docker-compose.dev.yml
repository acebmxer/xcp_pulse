# Development override: build the image from source instead of pulling it from
# GHCR. Use alongside the main compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# The service keeps the image: tag from the main file, so the freshly built
# image is tagged the same and used in place of the published one.

services:
  xcp-pulse:
    build:
      context: .
      args:
        # Tells self-update this is a local build, not the published image —
        # see the Dockerfile's own comment on this ARG. Without it, a locally
        # built image kept under the same ghcr.io/... tag (as the comment
        # above explains this override does) still gets a real, different
        # digest from the one on GHCR, and the Update page would report
        # "update available" against a build that's actually ahead of
        # :latest, not behind it.
        XCP_PULSE_DEV_BUILD: "true"
